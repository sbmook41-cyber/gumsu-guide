<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  header h1{font-size:20px;} header .sub{color:#666;font-size:13px;margin-top:3px;}

  .arrow-h.r{right:-15px;} .arrow-h.l{left:-15px;}
  .refbox{margin-top:22px;border:1px solid #d5dae0;background:#fff;border-radius:10px;padding:12px 16px;}
  .refbox h3{font-size:14px;color:#2f4a63;margin-bottom:8px;}
  .refbox .items{display:flex;flex-wrap:wrap;gap:8px;}
  .refbox .ri{font-size:13px;background:#f3f6fa;border:1px solid #cfd9e6;border-radius:8px;padding:7px 12px;cursor:pointer;}

  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:94vw;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.18);transform:translateX(100%);transition:.2s;z-index:11;overflow-y:auto;}

  .db{padding:16px 18px;}
  .sec{margin-bottom:16px;} .sec .lbl{font-size:12px;font-weight:bold;color:#2f79d0;border-bottom:1px solid #e5e9ef;padding-bottom:4px;margin-bottom:6px;} .sec .tx{font-size:14px;color:#222;white-space:pre-line;}
  .forms{list-style:none;} .forms li{padding:8px 0;border-bottom:1px dashed #e5e9ef;font-size:13px;}
  .forms .nm{display:block;margin-bottom:5px;} .forms .acts{display:flex;gap:6px;}

  .ft{font-size:10px;color:#5a6b7a;background:#eef1f5;border:1px solid #d3dae2;border-radius:3px;padding:0 4px;margin-left:3px;vertical-align:middle;text-transform:uppercase;letter-spacing:.3px;}
  .board{display:flex;align-items:stretch;gap:0;}
  .board-main{flex:1;min-width:0;}

  .bg-item{margin-bottom:14px;} .bg-item b{color:#111;}
  @media(max-width:820px){.board{flex-direction:column;} .board-bigo{width:auto;margin-left:0;padding:10px 0 0;border-left:none;border-top:1px dashed #c9b98f;border-radius:0;margin-top:12px;}}
  .sheet{background:#fff;border:1px solid #cbd2da;border-radius:10px;padding:14px 20px 18px;box-shadow:0 3px 14px rgba(0,0,0,.07);}
  .sheet-title{background:#c9c9c9;color:#1a1a1a;font-weight:bold;font-size:15px;padding:8px 14px;border-radius:5px;margin-bottom:14px;}
  @page{size:A4 landscape;margin:8mm;}
  @media print{
    body{background:#fff;} .wrap{max-width:none;padding:0;}
    .hint,.tabs,.refbox,.drawer,.overlay,#lb{display:none!important;}

    .sheet{border:none;box-shadow:none;padding:0;}

</style>

  FLOW:[{s:null,l:[null,"pm",null,null]},{s:"납품 2주전",l:[null,{k:"req",ar:"r→"},"rcv",null]},{s:null,l:[null,null,{k:"reqx",ar:"r→"},"rcvx"]},{s:null,l:[null,null,"rev","revx"]},{s:null,l:[null,"self","make",{k:"makex",ar:"l←"}]},{s:null,l:[null,null,"comm",null]},{s:null,l:[null,"apply",{k:"agree",ar:"l←"},null]},{s:"납품 후 2주",l:[null,{k:"subm",ar:"r→"},"rcvr",null]},{s:null,l:[null,"reg",null,null]}],
  REF:[["설계도서검토 발송문구","참고사항 발송 메일",BS],["설계도서검토 참고사항","설계실 안내",RG],["설계도면 검토단계 요약·결재단계표","",P+"설계실_요약결재단계표.png"],["지연사유서(6-2)","지연 시 제출",null]],
  BIGO:"<div class='bg-item'><b>주1) 제출설계도서</b><br>1. 설계도면<br>① 기본건축도면 4부<br>&nbsp;&nbsp;&nbsp;(담당 및 부서장 검토도면)<br>② 기본구조도면 1부<br>&nbsp;&nbsp;&nbsp;(담당 및 부서장 검토도면)<br>③ 기본설비도면(소방포함) 2부<br>④ 기본전기도면(소방포함) 2부<br>⑤ 기본토목도면 2부<br>⑥ 기본조경도면 2부<br><br>2. 설계설명서 1부<br>3. 지질조사서 2부<br>4. 현황측량도 2부</div><div class='bg-item' style='margin-top:130px'><b>주2)</b> 설계팀은 설계도서 검토서와 체크리스트에 협력사, 설계팀, 기술실의 확인 서명이 된 것을 인트라넷에 등록해야 합니다.</div>"
 }
};

const TABS=['gi','si'];
let cur='gi';
const MAINSTEP={pm:1,req:1,rcv:1,reqx:1,rev:1,make:1,comm:1,agree:1,apply:1,subm:1};
const flow=document.getElementById('flow'),refs=document.getElementById('refs'),tabs=document.getElementById('tabs');
TABS.forEach(t=>{const b=document.createElement('div');b.className='tab'+(t===cur?' on':'');b.textContent=DATA[t].name;b.onclick=()=>render(t);tabs.appendChild(b);});

const NS='http://www.w3.org/2000/svg';
// [from, to, from측, to측, 1=MAIN(굵음) 0=SUB(가늘고 점선)]
const ARR=[
 ['pm','req','b','t',1],['req','rcv','r','l',1],['rcv','reqx','b','t',1],['reqx','rev','b','t',1],['rev','make','b','t',1],['make','comm','b','t',1],['comm','agree','b','t',1],['agree','apply','l','r',1],['apply','subm','b','t',1],['subm','rcvr','r','l',1,1],
 ['req','self','b','t',0],['self','apply','b','t',0],['reqx','rcvx','r','l',0],['rcvx','revx','b','t',0],['revx','makex','b','t',0],['makex','make','l','r',0],['subm','reg','b','t',0]
];
function anc(r,s){return s=='t'?[r.left+r.width/2,r.top]:s=='b'?[r.left+r.width/2,r.bottom]:s=='l'?[r.left,r.top+r.height/2]:[r.right,r.top+r.height/2];}
function drawArrows(){
  const svg=document.getElementById('arrows');if(!svg)return;
  const fr=flow.getBoundingClientRect();const W=flow.scrollWidth,H=flow.scrollHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);
  [...svg.querySelectorAll('path.ln')].forEach(e=>e.remove());
  ARR.forEach(a=>{
    const A=flow.querySelector('[data-k="'+a[0]+'"]'),B=flow.querySelector('[data-k="'+a[1]+'"]');if(!A||!B)return;
    const ra=A.getBoundingClientRect(),rb=B.getBoundingClientRect();
    const oa={left:ra.left-fr.left,top:ra.top-fr.top,right:ra.right-fr.left,bottom:ra.bottom-fr.top,width:ra.width,height:ra.height};
    const ob={left:rb.left-fr.left,top:rb.top-fr.top,right:rb.right-fr.left,bottom:rb.bottom-fr.top,width:rb.width,height:rb.height};
    const p1=anc(oa,a[2]),p2=anc(ob,a[3]);
    const pt=document.createElementNS(NS,'path');pt.setAttribute('class','ln');pt.setAttribute('fill','none');
    pt.setAttribute('d','M'+p1[0]+','+p1[1]+' L'+p2[0]+','+p2[1]);
    if(a[4]){pt.setAttribute('stroke','#2f4a63');pt.setAttribute('stroke-width','2');pt.setAttribute('marker-end','url(#am)');if(a[5])pt.setAttribute('marker-start','url(#ams)');}
    else{pt.setAttribute('stroke','#9aa5b1');pt.setAttribute('stroke-width','1.4');pt.setAttribute('stroke-dasharray','5,4');pt.setAttribute('marker-end','url(#as)');}
    svg.appendChild(pt);
  });
}
function render(t){
  cur=t;[...tabs.children].forEach((b,i)=>b.classList.toggle('on',TABS[i]===t));
  const D=DATA[t];flow.innerHTML='';
  const svg=document.createElementNS(NS,'svg');svg.id='arrows';
  svg.innerHTML='<defs><marker id="am" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2f4a63"/></marker><marker id="ams" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto-start-reverse"><path d="M0,0 L11,5.5 L0,11 z" fill="#2f4a63"/></marker><marker id="as" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa5b1"/></marker></defs>';
  flow.appendChild(svg);
  D.FLOW.forEach(r=>{
    const row=document.createElement('div');row.className='row';
    const c0=document.createElement('div');c0.className='cell';if(r.s)c0.innerHTML='<div class="sched">'+r.s+'</div>';row.appendChild(c0);
    r.l.slice(1).forEach(item=>{
      const c=document.createElement('div');c.className='cell';
      if(item&&typeof item==='object'&&item.note){c.innerHTML='<div class="flownote">'+item.note+'</div>';}
      else if(item){const key=(typeof item==='object')?item.k:item;const d=D.STEP[key];const ok=(d.click!==false);
        const card=document.createElement('div');card.className='card'+(ok?' click':(d.white?'':' no'))+(d.add?' add':'')+(MAINSTEP[key]?' mainstep':'');card.setAttribute('data-k',key);
        card.innerHTML=(d.add?'◆ ':'')+d.title.replace(/\s*\(이번에 추가\)/,'')+(ok?'<span class="badge">＋</span>':'');
        if(ok)card.onclick=()=>openD(key);c.appendChild(card);}
      row.appendChild(c);
    });
    flow.appendChild(row);
  });
  document.getElementById('bigo').innerHTML=D.BIGO||'';
  document.getElementById('sheetTitle').textContent=D.name+' 검토절차도';
  requestAnimationFrame(redraw);setTimeout(redraw,200);
}
function fitScreen(){var w=document.querySelector('.wrap');if(!w)return;w.style.transform='none';w.style.marginBottom='';var ch=w.scrollHeight,cw=w.scrollWidth,vh=window.innerHeight,vw=window.innerWidth;var s=Math.min(1,(vh-8)/ch,(vw-8)/cw);w.style.transformOrigin='top center';w.style.transform='scale('+s+')';w.style.marginBottom=(-(ch-ch*s))+'px';}
function redraw(){var w=document.querySelector('.wrap');if(w){w.style.transform='none';w.style.marginBottom='';}drawArrows();fitScreen();}
window.addEventListener('resize',redraw);

function openD(key){const d=DATA[cur].STEP[key];
  document.getElementById('d_who').textContent=d.who;document.getElementById('d_title').innerHTML=d.title.replace(/\s*\(이번에 추가\)/,'');
  let h='<div class="sec"><div class="lbl">할 일</div><div class="tx">'+d.job+'</div></div>';
  if(d.forms&&d.forms.length){h+='<div class="sec"><div class="lbl">필요 양식 / 자료</div><ul class="forms">';
    d.forms.forEach(f=>{var nm=dispName(f[2],f[0]);var e=dispExt(f[2]);var sub=(f[2]&&DL[f[2]])?'':(f[1]||'');h+='<li><span class="nm"><b>'+nm+'</b>'+(e?' <span class="ft">'+e+'</span>':'')+' '+sub+'</span>';
      if(f[2]==='txt'){h+='</li>';return;}
      h+='<span class="acts">';
      if(f[2]&&/\.png$/i.test(f[2]))h+='<button class="pv" onclick="preview(\''+f[2]+'\',\''+nm+'\')">미리보기</button>';else h+='<button class="off">미리보기 준비중</button>';
      if(NODL.indexOf(f[2])>=0)h+='<span class="off" title="기술실이 작성하는 양식입니다">기술실 작성용</span>';
      else h+=(f[2]&&DL[f[2]])?'<a class="dl" href="'+encodeURI(DL[f[2]])+'" download>다운로드</a>':'<button class="off">다운로드 준비중</button>';
      h+='</span></li>';});
    h+='</ul></div>';}
  if(d.note)h+='<div class="sec"><div class="lbl">참고</div><div class="tx">'+d.note+'</div></div>';
  document.getElementById('d_body').innerHTML=h;document.getElementById('ov').classList.add('show');document.getElementById('dw').classList.add('show');
}
function closeD(){document.getElementById('ov').classList.remove('show');document.getElementById('dw').classList.remove('show');}
function preview(src,cap){document.getElementById('lb_img').src=src;document.getElementById('lb_cap').textContent=cap+' — 미리보기';document.getElementById('lb').classList.add('show');}
function closeLb(){document.getElementById('lb').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLb();closeD();}});
render('gi');
</script>
